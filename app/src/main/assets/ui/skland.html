<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>森空岛登录状态</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080807;color:#e9e3d8;font-family:Roboto,"Noto Sans SC",sans-serif}
body{display:flex;align-items:center;padding:0 9px}
.bar{width:100%;height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:#a39b8c}
#status.ok{color:#91c6a0}
#status.bad{color:#df8c82}
button{flex:0 0 112px;width:112px;height:30px;border:1px solid #453923;border-radius:7px;background:#171511;color:#e1d1af;font-size:13px;font-weight:650}
</style>
</head>
<body>
<div class="bar">
<strong id="status">Token未获取</strong>
<button type="button" onclick="if(window.SklandUi&&SklandUi.back)SklandUi.back()">返回</button>
</div>
<script>
(function(){
  window.updateSklandState=function(raw){
    var state=raw;
    if(typeof raw==="string"){try{state=JSON.parse(raw)}catch(e){return}}
    if(!state||typeof state!=="object")return;
    var el=document.getElementById("status");
    if(!el)return;
    var acquired=state.tokenSaved===true;
    el.textContent=acquired?"Token已获取":"Token未获取";
    el.classList.toggle("ok",acquired);
    el.classList.remove("bad");
  };
})();
</script>
</body>
</html>
