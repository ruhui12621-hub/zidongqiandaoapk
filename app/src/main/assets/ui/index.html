<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>自动签到管理</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-mark">签</div>
      <div class="brand-copy"><strong>自动签到管理</strong><span>账号与云端服务</span></div>
      <button class="icon-button" data-action="refresh" aria-label="刷新">↻</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>账号</small></button>
      <button data-page="cloud" class="nav-item"><span>☁</span><small>华为云</small></button>
      <button data-page="messages" class="nav-item"><span>▤</span><small>运行消息</small></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
