name: Build Android APK
# PR builds validate the cloud-first account restore path.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'frontend/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest Huawei FunctionGraph packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/cloud
          release_json="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ruhui12621-hub/zidongqiandao-cloud-functions/releases/latest)"
          hoyolab_url="$(jq -r '.assets[] | select(.name == "hoyolab.zip") | .browser_download_url' <<< "$release_json" | head -n1)"
          skland_url="$(jq -r '.assets[] | select(.name == "skland.zip") | .browser_download_url' <<< "$release_json" | head -n1)"
          test -n "$hoyolab_url" && test -n "$skland_url"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" "$hoyolab_url" -o app/src/main/assets/cloud/hoyolab.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" "$skland_url" -o app/src/main/assets/cloud/skland.zip
          unzip -t app/src/main/assets/cloud/hoyolab.zip >/dev/null
          unzip -t app/src/main/assets/cloud/skland.zip >/dev/null
          jq -r '"release_tag=" + .tag_name + "\\nrelease_commit=" + .target_commitish + "\\npublished_at=" + .published_at' <<< "$release_json" > app/src/main/assets/cloud/manifest.txt
          echo "Embedded cloud-function package manifest:"
          cat app/src/main/assets/cloud/manifest.txt
          ls -lh app/src/main/assets/cloud/

      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify embedded cloud-function ZIPs and React assets
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/cloud/hoyolab.zip'
          unzip -Z1 "$apk" | grep -Fx 'assets/cloud/skland.zip'
          unzip -Z1 "$apk" | grep -Fx 'assets/cloud/manifest.txt'
          unzip -Z1 "$apk" | grep -Fx 'assets/ui/index.html'
          unzip -Z1 "$apk" | grep -Fx 'assets/ui/login-status.html'
          unzip -Z1 "$apk" | grep -Fx 'assets/ui/skland-status.html'
          unzip -Z1 "$apk" | grep -E '^assets/ui/static/.*\\.js$'
          unzip -Z1 "$apk" | grep -E '^assets/ui/static/.*\\.css$'
          echo "Verified: cloud-function packages and all React pages are embedded in the APK."

      - name: Upload APK for direct download
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: HoyoCookieManager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add prominent APK download link
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          {
            echo "## APK 下载"
            echo
            echo "[**⬇ 点击下载 APK（GitHub Actions）**]($ARTIFACT_URL)"
            echo
            echo "下载内容为 GitHub Artifact ZIP，解压后得到 `app-debug.apk`。"
          } >> "$GITHUB_STEP_SUMMARY"
